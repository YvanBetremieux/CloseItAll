name: Android

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4

      - name: Unit tests and debug build
        run: ./gradlew --no-daemon testDebugUnitTest assembleDebug

      - name: Build signed release APK
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          CLOSEITALL_KEYSTORE_BASE64: ${{ secrets.CLOSEITALL_KEYSTORE_BASE64 }}
          CLOSEITALL_KEYSTORE_PASSWORD: ${{ secrets.CLOSEITALL_KEYSTORE_PASSWORD }}
          CLOSEITALL_KEY_ALIAS: ${{ secrets.CLOSEITALL_KEY_ALIAS }}
          CLOSEITALL_KEY_PASSWORD: ${{ secrets.CLOSEITALL_KEY_PASSWORD }}
        run: |
          if [ -z "$CLOSEITALL_KEYSTORE_BASE64" ]; then echo "::error::CLOSEITALL_KEYSTORE_BASE64 secret missing"; exit 1; fi
          echo "$CLOSEITALL_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
          export CLOSEITALL_KEYSTORE="$RUNNER_TEMP/release.jks"
          ./gradlew --no-daemon assembleRelease
          cp app/build/outputs/apk/release/app-release.apk "CloseItAll-${GITHUB_REF_NAME}.apk"

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: CloseItAll-${{ github.ref_name }}.apk
          generate_release_notes: true
